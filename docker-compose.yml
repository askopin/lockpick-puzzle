services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lockpick
      POSTGRES_USER: lockpick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lockpick}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockpick"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://lockpick:${POSTGRES_PASSWORD:-lockpick}@db:5432/lockpick
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
